<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home" />
    <!-- Aapki Apni CSS File -->
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home" />
    <link href="style.css" rel="stylesheet">
    
</head>
<body>

    <!-- Navbar Section -->
    <div class="box1" style="background-color:#1A2332;">
        <li>|contact us</li>
        <li>|about us</li>
        <span class="material-symbols-outlined">
         home
        </span>
        <li>|Home</li>
        <li>|profile</li>
    </div>

    <!-- Main Content Container -->
    <div class="container">        
        <!-- Left Side Input Box (Form) -->
        <div class="box2" style="background-color:#D4AF37;">
            <input type="email" class="email" placeholder="Enter your email...">
            <input type="number" class="phonenumber" placeholder="Enter your phone number...">
            <input type="text" class="enteryourname" placeholder="Enter your full name">
            <input type="number" class="age" placeholder="Enter your age..">
            <input type="password" class="password" placeholder="Enter your password">
            
            <!-- Button Ke Andar Font Awesome Ka Check Icon Inject Kiya Hai -->
            <button class="btn1">
                <i class="fas fa-check-circle"></i> Enter
            </button>
        </div>
        <!-- Right Side Animated Info Box -->
        <div class="animated-box2" style="background-color:#1a2332;">
            <p>INFORMATION</p>
        </div>
    </div>
    <!-- JavaScript File Connection -->
    <script src="script.js"></script>
</body>
</html>
